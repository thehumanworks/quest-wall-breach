name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Tools for procedural sound generation
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet numpy || python3 -m pip install --quiet --break-system-packages numpy

      - name: Bootstrap (wrapper jar + sounds)
        run: |
          sh bootstrap.sh
          ls -la app/src/main/assets/audio

      - name: Unit tests (sim, protocol, loopback co-op networking)
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build signed debug APK
        run: |
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk wall-breach.apk
          sha256sum wall-breach.apk | tee wall-breach.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: wall-breach-apk
          path: |
            wall-breach.apk
            wall-breach.apk.sha256

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Wall Breach v1.0.${{ github.run_number }}
          make_latest: "true"
          body: |
            Sideloadable debug APK for Meta Quest 3 (Meta Spatial SDK, arm64).
            Install: `adb install -r wall-breach.apk` — see the README for full Mac steps.
          files: |
            wall-breach.apk
            wall-breach.apk.sha256
